# CF manifest for Figaf Manager (the wizard app itself).
# Deployed once via BTP cockpit "Deploy Application" — no service bindings required.
# The wizard is gated by cf login --sso (passcode) rather than XSUAA.
applications:
  - name: figaf-manager
    memory: 128M
    # The quota covers the whole container: the droplet with the cf and btp
    # binaries, the release cache in /tmp (two versions, one zip per CF app)
    # and the per-session directories under $HOME/sessions. 512M ran full
    # on 2026-09-09 ("no space left on device" from every cf call).
    disk_quota: 2G
    instances: 1
    buildpack: nodejs_buildpack
    # Ubuntu 24.04 stack (figaf-faid decision 0015, 2026-09-07). cflinuxfs4 is
    # deprecated on SAP BTP. The manager's approuter follows this stack
    # (CF_STACK, packages/core/cf-stack.js). Node 24.x comes from engines.node.
    stack: cflinuxfs5
    command: node cloud/server.js
    random-route: true
    env:
      NODE_ENV: production
      FIGAF_LOG_LEVEL: cli
      # The FAID release store (figaf-faid decision 0010): the manager
      # lists, downloads and verifies releases from here. Public read URL of the
      # Cloudflare R2 bucket (figaf-faid release/publish.js writes it). A
      # custom domain or a mirror is a change of this value only. For a local
      # release directory (development, e2e) set FIGAF_FAID_ARTIFACTS_DIR instead.
      # Two channels (figaf-faid decision 0017): .../faid holds the release
      # versions x.y.z for customers; .../faid-dev holds the dev versions
      # x.y.z-dev.N that Jenkins publishes from a branch. A manager used to
      # TEST changes (Emil's space, the dev space) ends this value in /faid-dev
      # (cf set-env figaf-manager FIGAF_FAID_RELEASE_URL <url>/faid-dev, then
      # cf restart); a customer's manager never does.
      FIGAF_FAID_RELEASE_URL: https://pub-086a7914662e477595f40f58270518b9.r2.dev/faid
      # FIGAF_LOG_LEVEL controls the verbosity of logs emitted by the wizard.
      #│ off   │ nothing (no-op fast path)                                     │
      #├───────┼───────────────────────────────────────────────────────────────┤
      #│ cli   │ every external process: cf, btp, npm, etc.                    │
      #├───────┼───────────────────────────────────────────────────────────────┤
      #│ ipc   │ cli + every window.figaf handler call (channel, args, result) │
      #├───────┼───────────────────────────────────────────────────────────────┤
      #│ net   │ ipc + every httpsDownload / httpsJson / httpsGet              │
    
      # Optional: pin deployment template source (defaults to GitHub btp-users branch tip)
      # FIGAF_DEPLOYMENT_ZIP_URL: https://your-mirror.example.com/btp-users.zip
      # Maintenance mode is OFF on this branch: the FAID Apps manager is a
      # persistent console that is redeployed often, and every push re-applies
      # the manifest env (a `cf unset-env` does not survive the next push).
      # Set FIGAF_MANAGER_MAINTENANCE: 1 explicitly when a maintenance window
      # is wanted.
      # FIGAF_MANAGER_MAINTENANCE: 1
      # v2 idle-self-destruct (V4 in auth-gate-implementation-plan.md §2.10).
      # When set to a positive integer, the wizard tears ITSELF down after
      # that many hours without authenticated traffic. Bounds the exposure
      # window of a wizard that an operator deployed and walked away from.
      # FIGAF_IDLE_SELF_DESTRUCT_HOURS: 24
      # FIGAF_IDLE_SELF_DESTRUCT_GRACE: 30   # warning emitted N min before
